[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-circuit-discovery"
version = "0.1.1"
description = "Discover and evaluate candidate GPT-OSS expert-neuron circuits from labeled examples"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/c4554ndr4/moe-circuit-discovery"
Documentation = "https://github.com/c4554ndr4/moe-circuit-discovery/blob/main/README.md"

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==4.57.6", "accelerate==1.10.1", "numpy==2.2.6"]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
moe-circuits = "moe_circuits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
